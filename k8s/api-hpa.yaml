apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paypilot-api-hpa
  namespace: paypilot
  labels:
    app.kubernetes.io/name: paypilot-api
    app.kubernetes.io/part-of: paypilot
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paypilot-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
