apiVersion: v1
kind: ConfigMap
metadata:
  name: paypilot-config
  namespace: paypilot
  labels:
    app.kubernetes.io/name: paypilot
    app.kubernetes.io/part-of: paypilot
    app.kubernetes.io/component: config
data:
  PAYPILOT_ENV: "production"
  REQUIRE_AUTH: "true"
  FASTAPI_HOST: "0.0.0.0"
  FASTAPI_PORT: "8000"
  APP_WORKERS: "1"
  SHUTDOWN_TIMEOUT_SECONDS: "15.0"
  
  # Storage & Database Backends
  DATA_BACKEND: "postgres"
  JOB_STORE_BACKEND: "sql"
  AUDIT_STORE_BACKEND: "sql"
  RATE_LIMIT_BACKEND: "redis"
  PERSISTENCE_BACKEND: "redis"
  IDEMPOTENCY_STORE_BACKEND: "redis"

  # Connection Pool Sizing
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30.0"
  DB_POOL_PRE_PING: "true"

  # Job Runner & Worker Fleet
  JOB_MAX_WORKERS: "3"
  JOB_MAX_QUEUE_SIZE: "50"
  JOB_MAX_RETAINED_JOBS: "200"
  JOB_LEASE_TIMEOUT_SECONDS: "300"

  # Resilience & Circuit Breakers
  LLM_MAX_RETRIES: "2"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "3"
  CIRCUIT_BREAKER_RECOVERY_TIME: "30.0"

  # Observability & SLO Targets
  TRACING_ENABLED: "true"
  SLO_ANALYZE_P95_MS: "1500.0"
  SLO_ERROR_RATE_PERCENT: "1.0"
  SLO_JOB_SUCCESS_PERCENT: "99.0"
