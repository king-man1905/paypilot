apiVersion: batch/v1
kind: Job
metadata:
  name: paypilot-migration-job
  namespace: paypilot
  labels:
    app.kubernetes.io/name: paypilot-migration
    app.kubernetes.io/part-of: paypilot
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paypilot-migration
        app.kubernetes.io/part-of: paypilot
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migration-runner
          image: paypilot:v1.24.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.storage.migrator"]
          envFrom:
            - configMapRef:
                name: paypilot-config
            - secretRef:
                name: paypilot-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
