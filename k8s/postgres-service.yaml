apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: paypilot
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: paypilot
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
