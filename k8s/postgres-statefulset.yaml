# ==============================================================================
# LOCAL DATABASE SIMULATION — NOT PRODUCTION MANAGED POSTGRESQL HA
# For production cloud deployments, use managed cloud RDS/Cloud SQL or a dedicated HA Operator.
# ==============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: paypilot
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: paypilot
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: paypilot
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "paypilot"
            - name: POSTGRES_USER
              value: "paypilot"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paypilot-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "paypilot", "-d", "paypilot"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "paypilot", "-d", "paypilot"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
