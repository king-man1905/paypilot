apiVersion: v1
kind: Secret
metadata:
  name: paypilot-secrets
  namespace: paypilot
  labels:
    app.kubernetes.io/name: paypilot
    app.kubernetes.io/part-of: paypilot
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Sensitive Database & Cache Connection Strings (Inject at deployment)
  DATABASE_URL: "<inject-at-deployment-time>"
  REDIS_URL: "<inject-at-deployment-time>"
  
  # API Authentication & Gateway Keys
  PAYPILOT_API_KEY: "<inject-at-deployment-time>"
  PAYPILOT_ADMIN_KEY: "<inject-at-deployment-time>"

  # External LLM Provider API Keys
  NVIDIA_API_KEY: "<inject-at-deployment-time>"

  # Infrastructure Root Passwords
  POSTGRES_PASSWORD: "<inject-at-deployment-time>"
  REDIS_PASSWORD: "<inject-at-deployment-time>"
