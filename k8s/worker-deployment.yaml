apiVersion: apps/v1
kind: Deployment
metadata:
  name: paypilot-worker
  namespace: paypilot
  labels:
    app.kubernetes.io/name: paypilot-worker
    app.kubernetes.io/part-of: paypilot
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paypilot-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paypilot-worker
        app.kubernetes.io/part-of: paypilot
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: paypilot-worker
          image: paypilot:v1.24.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.jobs.runner"]
          envFrom:
            - configMapRef:
                name: paypilot-config
            - secretRef:
                name: paypilot-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
