# ==============================================================================
# PayPilot Render Infrastructure as Code Blueprint
# Declarative multi-service deployment for Render Cloud
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PayPilot FastAPI & Multi-Agent Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: paypilot-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PAYPILOT_ENV
        value: production
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: SUPERVISOR_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b
      - key: AGGREGATOR_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: RECOVERY_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_REQUEST_TIMEOUT
        value: "60.0"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: PAYPILOT_API_KEY
        value: paypilot-prod-analyst-key
      - key: PAYPILOT_ADMIN_KEY
        value: paypilot-prod-admin-key
      - key: REQUIRE_AUTH
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: NVIDIA_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. PayPilot React + Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: paypilot-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paypilot-backend.onrender.com
